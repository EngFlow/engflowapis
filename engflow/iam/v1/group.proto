syntax = "proto3";

package engflow.iam.v1;

import "google/api/field_behavior.proto";

option go_package = "github.com/EngFlow/engflowapis/go/engflow/iam/v1;iamv1";

option java_multiple_files = true;
option java_outer_classname = "GroupProtos";
option java_package = "com.engflow.iam.v1.proto";

// A minimal, read-only view of a group and its assigned roles.
//
// NOTE: Currently `OUTPUT_ONLY` because groups creation is only supported via
// SCIM.
message Group {
  // Normalized, token-safe handle: [A-Za-z][A-Za-z0-9_-]*
  // Preferred human-facing identifier for CLI, docs, and audit logs.
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // External identifier (for example, v5 UUID derived from the SCIM display
  // name).
  string externalId = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Human-readable name.
  string display_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Names of EngFlow roles currently assigned to this group.
  repeated string role = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}
